<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>card — Kite9 fixture</title>
    <link rel="stylesheet" href="../scene.css" />
  </head>
  <body>
    <header>
      <h1>card</h1>
      <nav class="scenes" aria-label="Scenes">
        <a href="/preview/index.html">Index</a>
        <a href="/fixtures/html/empty.html">empty</a>
        <a href="/fixtures/html/card.html" aria-current="page">card</a>
      </nav>
      <span style="font-size: 0.85rem; color: #64748b">@kite9/test-template</span>
    </header>

    <div class="layout">
      <div id="mount">
        <!-- Light-DOM scene: minimal exercise of every test-template tag.
             Layout comes from fixtures/grid/card.json via bootScene. -->
        <kite9-diagram id="card">
          <kite9-glyph id="g1" shape="CARD" label="Glyph"></kite9-glyph>

          <kite9-container id="c1" label="Context">
            <kite9-glyph id="g2" label="Nested">
              <kite9-socket id="s1" direction="left"></kite9-socket>
            </kite9-glyph>
          </kite9-container>

          <kite9-arrow id="a1" label="Arrow"></kite9-arrow>

          <kite9-key id="k1" label="Key"></kite9-key>

          <kite9-link id="l1" shape="NORMAL" drawDirection="right">
            <from reference="g1"></from>
            <to reference="a1"></to>
            <kite9-from-label id="fl1"><text>from</text></kite9-from-label>
            <kite9-to-label id="tl1"><text>to</text></kite9-to-label>
            <fromDecoration>NONE</fromDecoration>
            <toDecoration>ARROW</toDecoration>
          </kite9-link>

          <kite9-link id="l2" shape="NORMAL">
            <from reference="a1"></from>
            <to reference="s1"></to>
            <fromDecoration>NONE</fromDecoration>
            <toDecoration>ARROW</toDecoration>
          </kite9-link>
        </kite9-diagram>
      </div>
      <aside>
        <h2>serializeDiagram</h2>
        <pre id="json"></pre>
      </aside>
    </div>

    <script type="module">
      import { bootScene } from "../scene-boot.ts";
      import layout from "../grid/card.json";
      bootScene(layout);
    </script>
  </body>
</html>
