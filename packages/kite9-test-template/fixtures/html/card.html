<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>card — Kite9 fixture</title>
    <link rel="stylesheet" href="../scene.css" />
  </head>
  <body>
    <header>
      <h1>card</h1>
      <nav class="scenes" aria-label="Scenes">
        <a href="/preview/index.html">Index</a>
        <a href="/fixtures/html/empty.html">empty</a>
        <a href="/fixtures/html/card.html" aria-current="page">card</a>
      </nav>
      <span style="font-size: 0.85rem; color: #64748b">@kite9/test-template</span>
    </header>

    <div class="layout">
      <div id="mount">
        <!--
          Light-DOM scene: minimal exercise of every test-template tag.
          col/row/width/height are layout hints for the grid fixtures
          (ignored by createDiagram today).
        -->
        <kite9-diagram id="card" content-cols="3" content-rows="2" gutter="64">
          <kite9-glyph
            id="g1"
            shape="CARD"
            label="Glyph"
            col="1"
            row="1"
            width="120"
            height="80"
          >
            <kite9-port id="p1" direction="right"></kite9-port>
          </kite9-glyph>

          <kite9-container id="c1" label="Context" col="3" row="1">
            <kite9-glyph id="g2" label="Nested" col="3" row="1" width="100" height="72">
              <kite9-socket id="s1" direction="left"></kite9-socket>
            </kite9-glyph>
          </kite9-container>

          <kite9-arrow id="a1" label="Arrow" col="2" row="1" width="64" height="40"></kite9-arrow>

          <kite9-key id="k1" col="1" row="2" width="100" height="56"></kite9-key>

          <kite9-link id="l1" shape="NORMAL" drawDirection="right">
            <from reference="g1"></from>
            <to reference="a1"></to>
            <kite9-from-label id="fl1"><text>from</text></kite9-from-label>
            <kite9-to-label id="tl1"><text>to</text></kite9-to-label>
            <fromDecoration>NONE</fromDecoration>
            <toDecoration>ARROW</toDecoration>
          </kite9-link>

          <kite9-link id="l2" shape="NORMAL">
            <from reference="a1"></from>
            <to reference="g2"></to>
            <fromDecoration>NONE</fromDecoration>
            <toDecoration>NONE</toDecoration>
          </kite9-link>

          <kite9-link id="l3" shape="NORMAL">
            <from reference="p1"></from>
            <to reference="s1"></to>
            <fromDecoration>NONE</fromDecoration>
            <toDecoration>NONE</toDecoration>
          </kite9-link>
        </kite9-diagram>
      </div>
      <aside>
        <h2>serializeDiagram</h2>
        <pre id="json"></pre>
      </aside>
    </div>

    <script type="module">
      import { bootScene } from "../scene-boot.ts";
      import layout from "../grid/card.json";
      bootScene(layout);
    </script>
  </body>
</html>
