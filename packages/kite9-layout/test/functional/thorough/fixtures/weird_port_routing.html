<kite9-diagram>
  <kite9-glyph id="b1" label="b1"></kite9-glyph>
  <kite9-container id="bigbox" style="fill: green; fill-opacity: 0.8; --kite9-margin-left: 50px; --kite9-layout: horizontal;">
    <kite9-glyph id="b2" label="b2"></kite9-glyph>
    <kite9-glyph id="b3" label="b3">
      <kite9-socket id="p1" style="--kite9-port-side: top;"></kite9-socket>
    </kite9-glyph>
    <kite9-socket id="2" style="--kite9-port-side: left"></kite9-socket>
  </kite9-container>
  <kite9-link id="link1" r="r">
    <from id="link1-from" reference="p1" shape="arrow"></from>
    <to id="link1-to" reference="2" shape="arrow"></to>
  </kite9-link>
  <kite9-link id="link2">
    <from id="link2-from" reference="b3"></from>
    <to id="link2-to" reference="2"></to>
  </kite9-link>
</kite9-diagram>
