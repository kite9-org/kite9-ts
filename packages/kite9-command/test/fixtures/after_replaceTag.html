<!DOCTYPE html>
<html><body>
<diagram id="The Diagram">
    <glyph id="one">
      <label id="one-label">One</label>
    </glyph>
    <glyph id="two">
      <label id="two-label">Two</label>
    </glyph>
    <glyph id="link" rank="4">
      <from reference="one" id="link-from"></from>
      <to reference="two" class="arrow" id="link-to"></to>
    </glyph>
  </diagram>
</body></html>
