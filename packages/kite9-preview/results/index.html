<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@kite9/layout test results</title>
    <link rel="stylesheet" href="__RESULTS_CSS__" />
  </head>
  <body>
    <h1>Layout test results</h1>
    <p class="lead">Functional outputs under <code>outputs/</code>. Icons open diagram / positions / compaction / source HTML (hover PNG icons to preview). Click a column header to sort. Use <strong>Accept</strong> when actual differs from expected to promote the new baseline.</p>
    <p class="empty" id="empty" hidden>No outputs yet. Run <code>pnpm test</code> first.</p>
    <div id="table-wrap" hidden>
      <div class="cols head" role="row">
        <button type="button" data-sort="name" aria-label="Sort by name">Name<span class="dir"></span></button>
        <button type="button" data-sort="status" aria-label="Sort by status">Status<span class="dir"></span></button>
        <button type="button" data-sort="at" class="active" aria-label="Sort by time">Time<span class="dir">↓</span></button>
        <span class="action-label">Action</span>
      </div>
      <ul id="results"></ul>
    </div>
    <div id="preview" aria-hidden="true"><img alt="" /></div>
    <script type="application/json" id="results-data">__RESULTS_DATA__</script>
    <script type="module" src="__RESULTS_CLIENT__"></script>
  </body>
</html>
